user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
	worker_connections 2048;
	multi_accept on;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	server_tokens off;
	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;
	keepalive_timeout 65;
	types_hash_max_size 2048;

	# Large resumable chunked uploads & direct downloads (no Nginx buffering bottleneck)
	client_max_body_size 0;
	client_body_timeout 3600s;
	proxy_read_timeout 3600s;
	proxy_send_timeout 3600s;
	proxy_connect_timeout 60s;

	# High-speed Gzip compression for JSON APIs, JS, CSS, SVG
	gzip on;
	gzip_vary on;
	gzip_proxied any;
	gzip_comp_level 5;
	gzip_min_length 1024;
	gzip_types
		text/plain
		text/css
		text/xml
		text/javascript
		application/json
		application/javascript
		application/x-javascript
		application/xml
		application/xml+rss
		image/svg+xml;

	upstream lizzart_backend {
		server 127.0.0.1:3001;
		keepalive 32;
	}

	server {
		listen 3000 default_server;
		listen [::]:3000 default_server;
		server_name _;

		# Serve immutable SvelteKit static assets directly from disk (zero Node/Bun CPU overhead)
		location /_app/immutable/ {
			alias /app/build/client/_app/immutable/;
			expires max;
			add_header Cache-Control "public, max-age=31536000, immutable";
			access_log off;
		}

		# Zero-buffering streaming for file uploads & downloads
		location ~ ^/api/(files/upload|files/[^/]+/content|share/[^/]+/download|admin/backups) {
			proxy_pass http://lizzart_backend;
			proxy_http_version 1.1;
			proxy_set_header Connection "";
			proxy_set_header Host $http_host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_request_buffering off;
			proxy_buffering off;
		}

		# General SvelteKit SSR & API routes
		location / {
			proxy_pass http://lizzart_backend;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
			proxy_set_header Host $http_host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}
	}
}
